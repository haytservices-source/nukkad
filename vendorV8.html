    .login-input {

      padding: 14px 16px; font-size: 15px; font-family: inherit; margin-bottom: 12px;
      outline: none; transition: border-color 0.2s;

    .login-input:focus { border-color: var(--primary); }
    .login-btn {
      width: 100%; padding: 16px; background: var(--primary); border-radius: var(--radius-lg);

    /* ===== BUTTONS ===== */
    .btn-primary {

    .btn-secondary {

  <script>
    const STORAGE_KEY = 'nukkad_data';
let memoryState = null;
let db = null;
let firebaseReady = false;

function getState() {
  return memoryState;
}

async function saveState(s) {
  memoryState = JSON.parse(JSON.stringify(s));
  if (!db) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch(e) {}
    return;
  }
  const batch = db.batch();
  const metaRef = db.collection('metadata').doc('appState');
  batch.set(metaRef, {
    currentVendorId: s.currentVendorId,
    nextVendorId: s.nextVendorId,
    nextPhotoId: s.nextPhotoId,
    nextProductId: s.nextProductId
  }, { merge: true });
  s.vendors.forEach(v => {
    batch.set(db.collection('vendors').doc(v.id), v);
  });
  try {
    await batch.commit();
  } catch (e) {
    console.error('Firebase save error:', e);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch(e2) {}
  }
}

async function deleteVendorDoc(id) {
  if (!db) return;
  try {
    await db.collection('vendors').doc(id).delete();
  } catch (e) {
    console.error('Delete error:', e);
  }
}

function initSharedState() {
  if (!memoryState) {
    memoryState = getDefaultState();
  }
  memoryState.vendors.forEach(v => {
    if (!v.photos) v.photos = [];
    if (!v.products) v.products = [];
    if (v.suspended === undefined) v.suspended = false;
    if (!v.emoji) v.emoji = getEmoji(v.type);
    if (!v.color) v.color = getColor(v.type);
  });
  return memoryState;
}

function initFirebase() {
  const firebaseConfig = {
    apiKey: "AIzaSyDSmSlbV9frqwJBN5HLxEsJcRPZRAWuEjM",
    authDomain: "zahed-6b455.firebaseapp.com",
    projectId: "zahed-6b455",
    storageBucket: "zahed-6b455.firebasestorage.app",
    messagingSenderId: "1083482711534",
    appId: "1:1083482711534:web:8a60e365eb65cad7ab9aff",
    measurementId: "G-NP4SGR7LC1"
  };

  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();

  db.collection('vendors').onSnapshot(snapshot => {
    const vendors = [];
    snapshot.forEach(doc => {
      vendors.push({ id: doc.id, ...doc.data() });
    });

    db.collection('metadata').doc('appState').get().then(metaDoc => {
      const meta = metaDoc.exists ? metaDoc.data() : {};
      const hadData = memoryState && memoryState.vendors && memoryState.vendors.length > 0;

      memoryState = {
        vendors: vendors.length > 0 ? vendors : (hadData ? memoryState.vendors : getDefaultState().vendors),
        currentVendorId: meta.currentVendorId !== undefined ? meta.currentVendorId : (memoryState ? memoryState.currentVendorId : null),
        nextVendorId: meta.nextVendorId !== undefined ? meta.nextVendorId : (memoryState ? memoryState.nextVendorId : 6),
        nextPhotoId: meta.nextPhotoId !== undefined ? meta.nextPhotoId : (memoryState ? memoryState.nextPhotoId : 4),
        nextProductId: meta.nextProductId !== undefined ? meta.nextProductId : (memoryState ? memoryState.nextProductId : 3)
      };

      memoryState.vendors.forEach(v => {
        if (!v.photos) v.photos = [];
        if (!v.products) v.products = [];
        if (v.suspended === undefined) v.suspended = false;
        if (!v.emoji) v.emoji = getEmoji(v.type);
        if (!v.color) v.color = getColor(v.type);
      });

      if (vendors.length === 0 && !hadData) {
        saveState(memoryState);
      }

      firebaseReady = true;
      onFirebaseReady();
    });
  }, err => {
    console.error('Firebase error:', err);
    firebaseReady = true;
    onFirebaseReady();
  });
}
function getEmoji(t) {
      const m = { fruits:'🍎', vegetables:'🥬', snacks:'🍿', tea:'☕', flowers:'🌸', juice:'🥤',

      return m[t] || '🛒';
    }
    function getColor(t) {
      const m = { fruits:'#FF6B35', vegetables:'#1A936F', snacks:'#FF9800', tea:'#8D6E63', flowers:'#E91E63',
        juice:'#8BC34A', clinic:'#2196F3', medical:'#E53935', grocery:'#FF5722', hardware:'#795548',
        electrical:'#FFC107', showroom:'#9C27B0', other:'#607D8B' };
      return m[t] || '#888';
    }

    // ===================== STATE =====================
    let state = {
      vendor: null,
      activeTab: 'dashboard',
      uploading: false,
      editProductId: null,
      selectedProductCats: []
    };

    // ===================== AUTH =====================
    function doLogin() {
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value.trim();
      const shared = initSharedState();
      const v = shared.vendors.find(v => v.username === user && v.password === pass && v.status === 'approved');
      if (v) {
        shared.currentVendorId = v.id;
        saveState(shared);
        state.vendor = JSON.parse(JSON.stringify(v));
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
        renderContent();
      } else {
        document.getElementById('login-error').classList.add('show');
      }
    }
    function logout() {
      const shared = getState();
      if (shared) { shared.currentVendorId = null; saveState(shared); }
      state.vendor = null;
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('login-user').value = '';
      document.getElementById('login-pass').value = '';
      document.getElementById('login-error').classList.remove('show');
    }
    function checkSession() {
      try {
        const shared = getState();
        if (shared && shared.currentVendorId) {
          const v = shared.vendors.find(v => v.id === shared.currentVendorId);
          if (v && v.status === 'approved' && !v.suspended) {
            state.vendor = JSON.parse(JSON.stringify(v));
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            renderContent();
            return;
          }
        }
      } catch (e) { console.error('checkSession error:', e); }
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
    }

    // ===================== TABS =====================
    function setTab(tab) {
      state.activeTab = tab;
      state.editProductId = null;
      state.selectedProductCats = [];
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const idx = ['dashboard','photos','products','profile'].indexOf(tab);
      if (idx >= 0) document.querySelectorAll('.tab-btn')[idx].classList.add('active');
      renderContent();
    }

    // ===================== SYNC =====================
    function syncVendor() {
      const shared = getState();
      if (!shared || !state.vendor) return;
      const v = shared.vendors.find(x => x.id === state.vendor.id);
      if (v) state.vendor = JSON.parse(JSON.stringify(v));
    }
    async function saveVendor() {
      const shared = getState();
      if (!shared || !state.vendor) return;
      const idx = shared.vendors.findIndex(x => x.id === state.vendor.id);
      if (idx !== -1) {
        shared.vendors[idx] = state.vendor;
        saveState(shared);
      }
    }

    // ===================== RENDER =====================
    function renderContent() {
      try {
        syncVendor();
      } catch (e) { console.error('syncVendor error:', e); }
      const v = state.vendor;
      if (!v) return;
      const container = document.getElementById('vendor-scroll');
      if (!container) return;

      if (v.suspended) {
        container.innerHTML = `
          <div class="suspended-banner">
            <div class="title">⛔ Account Suspended</div>
            <div class="text">Your account has been temporarily suspended by admin. Please contact support.</div>
          </div>
          <div class="panel-card">
            <div class="panel-title">Contact Admin</div>
            <div class="detail-row" style="border:none; padding-top:0;">
              <div class="detail-icon"><i class="fas fa-envelope"></i></div>
              <div class="detail-content">
                <div class="title">support@nukkad.app</div>
                <div class="text">Email us for any queries</div>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (state.activeTab === 'dashboard') renderDashboardTab(container, v);
      else if (state.activeTab === 'photos') renderPhotosTab(container, v);
      else if (state.activeTab === 'products') renderProductsTab(container, v);
      else if (state.activeTab === 'profile') renderProfileTab(container, v);
    }

    function renderDashboardTab(container, v) {
      const sc = {
        pending: { bg:'#FFF8E1', color:'#F57C00', text:'⏳ Pending' },
        approved: { bg:'#E8F5E9', color:'#1A936F', text:'✓ Approved' },
        rejected: { bg:'#FFEBEE', color:'#E53935', text:'❌ Rejected' }
      }[v.status] || { bg:'#FFF8E1', color:'#F57C00', text:'⏳ Pending' };

      container.innerHTML = `
        <div class="panel-card">
          <div class="panel-header">
            <span class="panel-title">🎯 Status</span>
            <span class="status-badge" style="background:${sc.bg}; color:${sc.color};">${sc.text}</span>
          </div>
          <div class="panel-subtitle">
            ${v.status === 'approved' ? 'Your shop is approved. Toggle live to get customers.' :
              v.status === 'pending' ? 'Your profile is under review by admin.' :
              'Your profile was rejected. Update and resubmit.'}
          </div>
          <div class="toggle-row">
            <div class="toggle-label">
              <div class="title">Go Live</div>
              <div class="subtitle">${v.live ? '🟢 Live now' : 'Toggle to go live'}</div>
            </div>
            <div class="toggle-switch ${v.live ? 'active' : ''} ${v.status !== 'approved' ? 'disabled' : ''}" onclick="toggleLive()">
              <div class="toggle-knob"></div>
            </div>
          </div>
        </div>
        <div class="panel-card">
          <div class="panel-title">📊 Quick Stats</div>
          <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px;">
            <div style="text-align:center; padding: 12px; background: #FAFAFA; border-radius: 12px;">
              <div style="font-size: 20px; font-weight: 800;">${v.views || 0}</div>
              <div style="font-size: 11px; color: #888;">Views</div>
            </div>
            <div style="text-align:center; padding: 12px; background: #FAFAFA; border-radius: 12px;">
              <div style="font-size: 20px; font-weight: 800;">${v.calls || 0}</div>
              <div style="font-size: 11px; color: #888;">Calls</div>
            </div>
            <div style="text-align:center; padding: 12px; background: #FAFAFA; border-radius: 12px;">
              <div style="font-size: 20px; font-weight: 800;">${v.products?.length || 0}</div>
              <div style="font-size: 11px; color: #888;">Products</div>
            </div>
          </div>
        </div>
        <div class="panel-card">
          <div class="panel-title">📍 Location</div>
          <div class="detail-row" style="border:none; padding-top:8px;">
            <div class="detail-icon"><i class="fas fa-location-dot"></i></div>
            <div class="detail-content">
              <div class="title">${v.location}</div>
              <div class="text">Last updated: ${v.lastActive}</div>
            </div>
          </div>
          <button class="btn-secondary" style="width:100%; margin-top:8px;" onclick="updateGPS()">🔄 Update Location</button>
        </div>
        <div style="height:40px;"></div>
      `;
    }

    function renderPhotosTab(container, v) {
      const approved = v.photos?.filter(p => p.status === 'approved') || [];
      const pending = v.photos?.filter(p => p.status === 'pending') || [];
      const rejected = v.photos?.filter(p => p.status === 'rejected') || [];

      container.innerHTML = `
        <div class="panel-card">
          <div class="panel-header">
            <span class="panel-title">📸 Shop Photos</span>
            <span style="font-size:12px; color:#888;">${approved.length} approved</span>
          </div>
          <div class="photo-scroll">
            <div class="photo-add" onclick="pickImage()">
              ${state.uploading
                ? `<div class="spinner" style="width:24px;height:24px;border-width:3px;"></div>`
                : `<span class="plus">+</span><span class="label">Add</span>`}
            </div>
            ${approved.map(p => `<img src="${p.url}" class="photo-thumb">`).join('')}
          </div>
        </div>
        ${pending.length > 0 ? `
          <div class="panel-card">
            <div class="panel-title" style="margin-bottom:10px;">⏳ Pending Review</div>
            ${pending.map(p => `
              <div class="approval-item">
                <img src="${p.url}" class="approval-thumb">
                <div class="approval-content">
                  <div class="title">${p.caption}</div>
                  <div class="text">Under review by admin</div>
                  <span class="status-badge" style="background:#FFF8E1; color:#F57C00; margin-top:6px;">⏳ Pending</span>
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}
        ${rejected.length > 0 ? `
          <div class="panel-card">
            <div class="panel-title" style="margin-bottom:10px;">❌ Rejected</div>
            ${rejected.map(p => `
              <div class="approval-item rejected">
                <img src="${p.url}" class="approval-thumb rejected">
                <div class="approval-content">
                  <div class="title">${p.caption}</div>
                  <div class="text">${p.rejectReason || 'Does not meet guidelines'}</div>
                  <span class="status-badge" style="background:#FFEBEE; color:#E53935; margin-top:6px;">❌ Rejected</span>
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}
        <div style="height:40px;"></div>
      `;
    }

    function renderProductsTab(container, v) {
      const cats = ['fruits','vegetables','snacks','tea','flowers','juice','clinic','medical','grocery','hardware','electrical','showroom','other'];
      const catLabels = { fruits:'Fruits', vegetables:'Vegetables', snacks:'Snacks', tea:'Tea Shop', flowers:'Flowers', juice:'Juice',
        clinic:'Clinic', medical:'Medical', grocery:'Grocery', hardware:'Hardware', electrical:'Electricals', showroom:'Showroom', other:'Other' };

      if (state.editProductId === 'new') {
        container.innerHTML = `
          <div class="panel-card">
            <div class="panel-title">➕ Add Product</div>
            <div class="form-group" style="margin-top:12px;">
              <div class="form-label">Product Name *</div>
              <input type="text" class="form-input" id="prod-name" placeholder="e.g. Masala Chai">
            </div>
            <div class="form-group">
              <div class="form-label">Price *</div>
              <input type="text" class="form-input" id="prod-price" placeholder="e.g. ₹15/cup">
            </div>
            <div class="form-group">
              <div class="form-label">Categories (select multiple)</div>
              <div class="cat-grid" id="prod-cat-grid">
                ${cats.map(c => `<span class="cat-chip" onclick="toggleProdCat('${c}')" data-cat="${c}">${catLabels[c]}</span>`).join('')}
              </div>
            </div>
            <div class="btn-row">
              <button class="btn-secondary" onclick="setTab('products')">Cancel</button>
              <button class="btn-primary" onclick="saveProduct()">Save Product</button>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="panel-card">
          <div class="panel-header">
            <span class="panel-title">🛍️ My Products</span>
            <span style="font-size:12px; color:#888;">${v.products?.length || 0} items</span>
          </div>
          <button class="btn-primary" style="width:100%; margin-top:8px;" onclick="startAddProduct()">➕ Add New Product</button>
        </div>
        ${(v.products || []).map(p => `
          <div class="product-card">
            <div class="name">${p.name} <span style="color:var(--primary); font-size:13px;">${p.price}</span></div>
            <div class="meta">${p.available !== false ? '✅ Available' : '❌ Not Available'}</div>
            <div class="cats">${(p.categories || []).map(c => `<span class="cat-tag">${catLabels[c] || c}</span>`).join('')}</div>
            <div class="actions">
              <button class="edit" onclick="toggleProductAvail('${p.id}')">${p.available !== false ? 'Mark Unavailable' : 'Mark Available'}</button>
              <button class="del" onclick="deleteProduct('${p.id}')">Delete</button>
            </div>
          </div>
        `).join('')}
        <div style="height:40px;"></div>
      `;
    }

    function renderProfileTab(container, v) {
      container.innerHTML = `
        <div class="panel-card">
          <div class="panel-title">👤 Profile</div>
          <div class="form-group" style="margin-top:12px;">
            <div class="form-label">Shop Name</div>
            <input type="text" class="form-input" id="prof-name" value="${v.name}">
          </div>
          <div class="form-group">
            <div class="form-label">Phone Number</div>
            <input type="tel" class="form-input" id="prof-phone" value="${v.phone}">
          </div>
          <div class="form-group">
            <div class="form-label">What do you sell?</div>
            <input type="text" class="form-input" id="prof-items" value="${v.items}">
          </div>
          <div class="form-group">
            <div class="form-label">Location / Address</div>
            <input type="text" class="form-input" id="prof-location" value="${v.location}">
          </div>
          <button class="btn-primary" style="width:100%;" onclick="saveProfile()">💾 Save Changes</button>
        </div>
        <div class="panel-card">
          <div class="panel-title">🔐 Login Credentials</div>
          <div class="detail-row" style="border:none; padding-top:8px;">
            <div class="detail-icon"><i class="fas fa-user"></i></div>
            <div class="detail-content">
              <div class="title">Username</div>
              <div class="text">${v.username || 'Not set (pending approval)'}</div>
            </div>
          </div>
          <div class="detail-row" style="border:none;">
            <div class="detail-icon"><i class="fas fa-lock"></i></div>
            <div class="detail-content">
              <div class="title">Password</div>
              <div class="text">${v.password ? '••••••' : 'Not set (pending approval)'}</div>
            </div>
          </div>
          <div style="font-size:12px; color:var(--gray-500); margin-top:8px;">
            Credentials are managed by admin. Contact admin if you need to reset.
          </div>
        </div>
        <div style="height:40px;"></div>
      `;
    }

    // ===================== ACTIONS =====================
    function toggleLive() {
      syncVendor();
      if (state.vendor.status !== 'approved') { alert('Wait for admin approval first'); return; }
      state.vendor.live = !state.vendor.live;
      state.vendor.lastActive = state.vendor.live ? 'Just now' : 'Offline';
      saveVendor();
      alert(state.vendor.live ? 'You are LIVE! Customers can find you now.' : 'You are now offline.');
      renderContent();
    }
    async function updateGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            state.vendor.lat = pos.coords.latitude;
            state.vendor.lng = pos.coords.longitude;
            state.vendor.location = 'Lat: ' + pos.coords.latitude.toFixed(4) + ', Lng: ' + pos.coords.longitude.toFixed(4);
            state.vendor.lastActive = 'Just now';
            await saveVendor();
            alert('Location updated to current GPS position');
            renderContent();
          },
          () => { alert('Could not get location. Please allow location access.'); }
        );
      } else {
        alert('Geolocation not supported');
      }
    }
    function pickImage() {
      state.uploading = true;
      renderContent();
      setTimeout(() => {
        const demoPhotos = [
          { url:'https://images.unsplash.com/photo-1619566636858-adf3ef46400b?w=400', caption:'Shop photo', type:'shop' },
          { url:'https://images.unsplash.com/photo-1561336313-0bd5e0b27ec8?w=400', caption:'Items display', type:'items' },
          { url:'https://images.unsplash.com/photo-1490750967868-88aa4f44f222?w=400', caption:'Fresh stock', type:'items' }
        ];
        const p = demoPhotos[Math.floor(Math.random() * demoPhotos.length)];
        const shared = getState();
        const idx = shared.vendors.findIndex(x => x.id === state.vendor.id);
        if (idx !== -1) {
          const newPhoto = { id:'p'+shared.nextPhotoId, ...p, status:'pending',
            submittedAt: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), rejectReason:'' };
          shared.nextPhotoId++;
          shared.vendors[idx].photos.push(newPhoto);
          saveState(shared);
          state.vendor.photos = shared.vendors[idx].photos;
        }
        state.uploading = false;
        alert('Photo uploaded! Pending admin approval.');
        renderContent();
      }, 1200);
    }
    function saveProfile() {
      state.vendor.name = document.getElementById('prof-name').value.trim();
      state.vendor.phone = document.getElementById('prof-phone').value.trim();
      state.vendor.items = document.getElementById('prof-items').value.trim();
      state.vendor.location = document.getElementById('prof-location').value.trim();
      await saveVendor();
      alert('Profile updated!');
      renderContent();
    }
    function startAddProduct() {
      state.editProductId = 'new';
      state.selectedProductCats = [];
      renderContent();
    }
    function toggleProdCat(cat) {
      const idx = state.selectedProductCats.indexOf(cat);
      if (idx >= 0) state.selectedProductCats.splice(idx, 1);
      else state.selectedProductCats.push(cat);
      document.querySelectorAll('#prod-cat-grid .cat-chip').forEach(el => {
        el.classList.toggle('selected', state.selectedProductCats.includes(el.dataset.cat));
      });
    }
    function saveProduct() {
      const name = document.getElementById('prod-name').value.trim();
      const price = document.getElementById('prod-price').value.trim();
      if (!name || !price) { alert('Please fill product name and price'); return; }
      if (state.selectedProductCats.length === 0) { alert('Please select at least one category'); return; }
      const shared = getState();
      const idx = shared.vendors.findIndex(x => x.id === state.vendor.id);
      if (idx !== -1) {
        const newProd = { id:'pr'+shared.nextProductId, name, price, categories: [...state.selectedProductCats], available: true };
        shared.nextProductId++;
        shared.vendors[idx].products.push(newProd);
        saveState(shared);
        state.vendor.products = shared.vendors[idx].products;
      }
      state.editProductId = null;
      state.selectedProductCats = [];
      alert('Product added!');
      renderContent();
    }
    function toggleProductAvail(id) {
      const p = state.vendor.products.find(x => x.id === id);
      if (p) { p.available = p.available === false; saveVendor(); renderContent(); }
    }
    function deleteProduct(id) {
      if (!confirm('Delete this product?')) return;
      state.vendor.products = state.vendor.products.filter(x => x.id !== id);
      saveVendor();
      renderContent();
    }

    // ===================== SYNC LISTENERS =====================
    // Firebase onSnapshot handles cross-device sync automatically
    window.addEventListener('focus', () => { syncVendor(); renderContent(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { syncVendor(); renderContent(); } });

    // ===================== INIT =====================
    function onFirebaseReady() {
      checkSession();
      const loading = document.getElementById('firebase-loading');
      if (loading) loading.style.display = 'none';
    }
    initFirebase();
  </script>
</body>
</html>

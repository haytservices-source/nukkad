    const STORAGE_KEY = 'nukkad_data';
let memoryState = null;
let db = null;
let firebaseReady = false;

function getState() {
  return memoryState;
}

async function saveState(s) {
  memoryState = JSON.parse(JSON.stringify(s));
  if (!db) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch(e) {}
    return;
  }
  const batch = db.batch();
  const metaRef = db.collection('metadata').doc('appState');
  batch.set(metaRef, {
    currentVendorId: s.currentVendorId,
    nextVendorId: s.nextVendorId,
    nextPhotoId: s.nextPhotoId,
    nextProductId: s.nextProductId
  }, { merge: true });
  s.vendors.forEach(v => {
    batch.set(db.collection('vendors').doc(v.id), v);
  });
  try {
    await batch.commit();
  } catch (e) {
    console.error('Firebase save error:', e);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch(e2) {}
  }
}

async function deleteVendorDoc(id) {
  if (!db) return;
  try {
    await db.collection('vendors').doc(id).delete();
  } catch (e) {
    console.error('Delete error:', e);
  }
}

function initSharedState() {
  if (!memoryState) {
    memoryState = getDefaultState();
  }
  memoryState.vendors.forEach(v => {
    if (!v.photos) v.photos = [];
    if (!v.products) v.products = [];
    if (v.suspended === undefined) v.suspended = false;
    if (!v.emoji) v.emoji = getEmoji(v.type);
    if (!v.color) v.color = getColor(v.type);
  });
  return memoryState;
}

function initFirebase() {
  const firebaseConfig = {
    apiKey: "AIzaSyDSmSlbV9frqwJBN5HLxEsJcRPZRAWuEjM",
    authDomain: "zahed-6b455.firebaseapp.com",
    projectId: "zahed-6b455",
    storageBucket: "zahed-6b455.firebasestorage.app",
    messagingSenderId: "1083482711534",
    appId: "1:1083482711534:web:8a60e365eb65cad7ab9aff",
    measurementId: "G-NP4SGR7LC1"
  };

  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();

  db.collection('vendors').onSnapshot(snapshot => {
    const vendors = [];
    snapshot.forEach(doc => {
      vendors.push({ id: doc.id, ...doc.data() });
    });

    db.collection('metadata').doc('appState').get().then(metaDoc => {
      const meta = metaDoc.exists ? metaDoc.data() : {};
      const hadData = memoryState && memoryState.vendors && memoryState.vendors.length > 0;

      memoryState = {
        vendors: vendors.length > 0 ? vendors : (hadData ? memoryState.vendors : getDefaultState().vendors),
        currentVendorId: meta.currentVendorId !== undefined ? meta.currentVendorId : (memoryState ? memoryState.currentVendorId : null),
        nextVendorId: meta.nextVendorId !== undefined ? meta.nextVendorId : (memoryState ? memoryState.nextVendorId : 6),
        nextPhotoId: meta.nextPhotoId !== undefined ? meta.nextPhotoId : (memoryState ? memoryState.nextPhotoId : 4),
        nextProductId: meta.nextProductId !== undefined ? meta.nextProductId : (memoryState ? memoryState.nextProductId : 3)
      };

      memoryState.vendors.forEach(v => {
        if (!v.photos) v.photos = [];
        if (!v.products) v.products = [];
        if (v.suspended === undefined) v.suspended = false;
        if (!v.emoji) v.emoji = getEmoji(v.type);
        if (!v.color) v.color = getColor(v.type);
      });

      if (vendors.length === 0 && !hadData) {
        saveState(memoryState);
      }

      firebaseReady = true;
      onFirebaseReady();
    });
  }, err => {
    console.error('Firebase error:', err);
    firebaseReady = true;
    onFirebaseReady();
  });
}
function getEmoji(t) {

      const base = name.toLowerCase().replace(/[^a-z]/g, '').slice(0, 8);
      const num = Math.floor(100 + Math.random() * 900);
      return base + num;
    }
    function genPassword() {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      let p = '';
      for (let i = 0; i < 6; i++) p += chars[Math.floor(Math.random() * chars.length)];
      return p;
    }

      const shared = initSharedState();

            state.photos.push({ ...p, vendorId: v.id, vendorName: v.name });

    async function saveAdminState() {

                    </div>
                  </button>
                </div>
              </div>
              <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                <h3 class="text-lg font-bold text-text mb-4">Platform Health</h3>
                <div class="space-y-4">
                  <div><div class="flex justify-between text-sm mb-1"><span class="text-muted">Approval Rate</span><span class="font-bold text-text">94%</span></div><div class="h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-accent rounded-full" style="width:94%"></div></div></div>
                  <div><div class="flex justify-between text-sm mb-1"><span class="text-muted">Photo Quality</span><span class="font-bold text-text">87%</span></div><div class="h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-primary rounded-full" style="width:87%"></div></div></div>
                  <div><div class="flex justify-between text-sm mb-1"><span class="text-muted">Vendor Retention</span><span class="font-bold text-text">78%</span></div><div class="h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-secondary rounded-full" style="width:78%"></div></div></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ===================== VENDORS =====================
    function renderVendors() {
      let filtered = state.vendors;
      if (state.filterStatus !== 'all') filtered = filtered.filter(v => v.status === state.filterStatus);
      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        filtered = filtered.filter(v => v.name.toLowerCase().includes(q) || v.phone.includes(q) || v.location.toLowerCase().includes(q));
      }
      const tabs = [
        { id: 'all', label: 'All Vendors', count: state.vendors.length },
        { id: 'pending', label: 'Pending', count: state.vendors.filter(v => v.status === 'pending').length },
        { id: 'approved', label: 'Approved', count: state.vendors.filter(v => v.status === 'approved').length },
        { id: 'rejected', label: 'Rejected', count: state.vendors.filter(v => v.status === 'rejected').length },
      ];
      return `
        <div class="space-y-6">
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
            <div class="flex flex-wrap items-center gap-4">
              <div class="flex-1 min-w-[300px] relative">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="vendorSearch" placeholder="Search by name, phone, or location..." 
                  value="${state.searchQuery}" oninput="updateSearch(this.value)"
                  class="search-input w-full pl-11 pr-4 py-3 border-2 border-gray-100 rounded-xl text-sm focus:border-primary focus:outline-none transition-all">
              </div>
              <select onchange="updateFilter(this.value)" class="px-4 py-3 border-2 border-gray-100 rounded-xl text-sm focus:border-primary focus:outline-none bg-white">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="name">Name A-Z</option>
                <option value="rating">Highest Rated</option>
              </select>
            </div>
          </div>
          <div class="flex gap-6 border-b border-gray-200">
            ${tabs.map(t => `
              <button onclick="setVendorFilter('${t.id}')" class="tab-btn pb-3 text-sm font-semibold transition-all ${state.filterStatus === t.id ? 'active' : 'text-muted hover:text-text'}">
                ${t.label} <span class="ml-1 text-xs bg-gray-200 px-2 py-0.5 rounded-full">${t.count}</span>
              </button>
            `).join('')}
          </div>
          ${state.selectedVendors.size > 0 ? `
            <div class="batch-actions bg-primary text-white rounded-xl px-6 py-3 flex items-center justify-between shadow-lg shadow-orange-200">
              <span class="font-bold">${state.selectedVendors.size} vendor(s) selected</span>
              <div class="flex gap-3">
                <button onclick="batchApprove()" class="bg-white text-primary px-4 py-2 rounded-lg font-bold text-sm hover:bg-gray-50 transition-all">✓ Approve All</button>
                <button onclick="batchReject()" class="bg-danger text-white px-4 py-2 rounded-lg font-bold text-sm hover:opacity-90 transition-all">✕ Reject All</button>
                <button onclick="clearSelection()" class="bg-white/20 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-white/30 transition-all">Clear</button>
              </div>
            </div>
          ` : ''}
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead>
                  <tr class="bg-gray-50 border-b border-gray-100">
                    <th class="px-6 py-4 text-left"><input type="checkbox" class="checkbox-custom w-4 h-4 rounded" onchange="toggleSelectAll(this.checked, '${state.filterStatus}')"></th>
                    <th class="px-6 py-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Vendor</th>
                    <th class="px-6 py-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Type</th>
                    <th class="px-6 py-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Status</th>
                    <th class="px-6 py-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Live</th>
                    <th class="px-6 py-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Stats</th>
                    <th class="px-6 py-4 text-left text-xs font-bold text-muted uppercase tracking-wider">Last Active</th>
                    <th class="px-6 py-4 text-right text-xs font-bold text-muted uppercase tracking-wider">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${filtered.map(v => `
                    <tr class="vendor-row border-b border-gray-50 ${v.suspended ? 'opacity-60' : ''}">
                      <td class="px-6 py-4"><input type="checkbox" class="checkbox-custom w-4 h-4 rounded" ${state.selectedVendors.has(v.id) ? 'checked' : ''} onchange="toggleVendor('${v.id}')"></td>
                      <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-orange-600 flex items-center justify-center text-white font-bold">${v.name.charAt(0)}</div>
                          <div>
                            <div class="font-bold text-text">${v.name}</div>
                            <div class="text-xs text-muted">${v.phone}</div>
                          </div>
                        </div>
                      </td>
                      <td class="px-6 py-4"><span class="text-sm text-muted capitalize">${v.type}</span></td>
                      <td class="px-6 py-4">${renderStatusBadge(v.status, v.suspended)}</td>
                      <td class="px-6 py-4">
                        ${v.live && !v.suspended ? '<span class="flex items-center gap-1.5 text-xs font-bold text-accent"><span class="w-2 h-2 bg-accent rounded-full pulse-dot"></span>Live</span>' : '<span class="text-xs text-muted">Offline</span>'}
                      </td>
                      <td class="px-6 py-4">
                        <div class="text-sm"><span class="font-bold text-text">${formatNumber(v.views)}</span> <span class="text-muted">views</span></div>
                        <div class="text-sm"><span class="font-bold text-text">${v.calls || 0}</span> <span class="text-muted">calls</span></div>
                      </td>
                      <td class="px-6 py-4 text-sm text-muted">${v.lastActive}</td>
                      <td class="px-6 py-4 text-right">
                        <div class="flex items-center justify-end gap-2">
                          <button onclick="openVendorModal('${v.id}')" class="w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-600 transition-all" title="View Details"><i class="fas fa-eye text-xs"></i></button>
                          ${v.status === 'pending' ? `
                            <button onclick="approveVendor('${v.id}')" class="w-8 h-8 rounded-lg bg-green-100 hover:bg-green-200 flex items-center justify-center text-green-600 transition-all" title="Approve"><i class="fas fa-check text-xs"></i></button>
                            <button onclick="rejectVendor('${v.id}')" class="w-8 h-8 rounded-lg bg-red-100 hover:bg-red-200 flex items-center justify-center text-red-600 transition-all" title="Reject"><i class="fas fa-times text-xs"></i></button>
                          ` : ''}
                          ${v.status === 'approved' ? `
                            <button onclick="toggleVendorLive('${v.id}')" class="w-8 h-8 rounded-lg ${v.live ? 'bg-orange-100 text-orange-600' : 'bg-gray-100 text-gray-600'} hover:opacity-80 flex items-center justify-center transition-all" title="Toggle Live"><i class="fas fa-power-off text-xs"></i></button>
                          ` : ''}
                        </div>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
            ${filtered.length === 0 ? '<div class="text-center py-12 text-muted">No vendors found matching your criteria.</div>' : ''}
          </div>
        </div>
      `;
    }

    // ===================== PHOTOS =====================
    function renderPhotos() {
      const pendingPhotos = state.photos.filter(p => p.status === 'pending');
      const reviewedPhotos = state.photos.filter(p => p.status !== 'pending');
      return `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div class="flex gap-6 border-b border-gray-200">
              <button onclick="setPhotoTab('pending')" class="tab-btn pb-3 text-sm font-semibold transition-all ${state.photoTab !== 'reviewed' ? 'active' : 'text-muted hover:text-text'}">
                Pending Review <span class="ml-1 text-xs bg-warning text-white px-2 py-0.5 rounded-full">${pendingPhotos.length}</span>
              </button>
              <button onclick="setPhotoTab('reviewed')" class="tab-btn pb-3 text-sm font-semibold transition-all ${state.photoTab === 'reviewed' ? 'active' : 'text-muted hover:text-text'}">
                Reviewed <span class="ml-1 text-xs bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full">${reviewedPhotos.length}</span>
              </button>
            </div>
            ${pendingPhotos.length > 0 ? `
              <div class="flex gap-2">
                <button onclick="batchApprovePhotos()" class="btn-approve text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg shadow-green-200">✓ Approve All</button>
                <button onclick="batchRejectPhotos()" class="btn-reject text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg shadow-red-200">✕ Reject All</button>
              </div>
            ` : ''}
          </div>
          ${state.photoTab !== 'reviewed' ? renderPhotoGrid(pendingPhotos, true) : renderPhotoGrid(reviewedPhotos, false)}
        </div>
      `;
    }
    function renderPhotoGrid(photos, showActions) {
      if (photos.length === 0) {
        return `<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-12 text-center">
          <div class="text-6xl mb-4">📸</div>
          <div class="text-lg font-bold text-text mb-2">No photos here</div>
          <div class="text-muted">${showActions ? 'All photos have been reviewed!' : 'Reviewed photos will appear here.'}</div>
        </div>`;
      }
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          ${photos.map(p => `
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden card-hover">
              <div class="relative group">
                <img src="${p.url}" class="w-full h-48 object-cover cursor-pointer" onclick="openPhotoModal('${p.id}')" alt="${p.caption}">
                <div class="absolute top-3 right-3">${renderStatusBadge(p.status)}</div>
                <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-3">
                  <button onclick="openPhotoModal('${p.id}')" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-gray-700 hover:scale-110 transition-transform"><i class="fas fa-expand"></i></button>
                </div>
              </div>
              <div class="p-4">
                <div class="flex items-center gap-2 mb-2">
                  <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary to-orange-600 flex items-center justify-center text-white text-xs font-bold">${p.vendorName.charAt(0)}</div>
                  <div>
                    <div class="font-bold text-sm text-text">${p.vendorName}</div>
                    <div class="text-xs text-muted">${p.submittedAt}</div>
                  </div>
                </div>
                <div class="text-sm text-text mb-1 font-medium">${p.caption}</div>
                <div class="text-xs text-muted mb-3">Type: ${p.type}</div>
                ${showActions ? `
                  <div class="flex gap-2">
                    <button onclick="approvePhoto('${p.id}')" class="flex-1 btn-approve text-white py-2.5 rounded-xl text-sm font-bold shadow-md shadow-green-200 hover:shadow-lg transition-all">✓ Approve</button>
                    <button onclick="openRejectModal('${p.id}')" class="flex-1 btn-reject text-white py-2.5 rounded-xl text-sm font-bold shadow-md shadow-red-200 hover:shadow-lg transition-all">✕ Reject</button>
                  </div>
                ` : p.rejectReason ? `<div class="text-xs text-danger bg-red-50 p-2 rounded-lg">Reason: ${p.rejectReason}</div>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ===================== ANALYTICS =====================
    function renderAnalytics() {
      return `
        <div class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
              <h3 class="font-bold text-text mb-4">Vendor Growth</h3>
              <div class="h-40 flex items-end gap-2">
                ${[30,45,35,55,70,85,90,75,95,110,125,140].map((h,i) => `
                  <div class="flex-1 flex flex-col items-center gap-1">
                    <div class="w-full bg-gradient-to-t from-primary to-orange-400 rounded-t-lg" style="height:${h}px"></div>
                    <span class="text-xs text-muted">${['J','F','M','A','M','J','J','A','S','O','N','D'][i]}</span>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
              <h3 class="font-bold text-text mb-4">Category Distribution</h3>
              <div class="space-y-3">
                ${['fruits','vegetables','snacks','tea','flowers','juice','medical','grocery','hardware','electrical','showroom'].map((cat,i) => {
                  const count = state.vendors.filter(v => v.type === cat).length;
                  const pct = state.vendors.length ? (count / state.vendors.length * 100).toFixed(0) : 0;
                  const colors = ['bg-orange-500','bg-green-500','bg-yellow-500','bg-amber-700','bg-pink-500','bg-lime-500','bg-red-500','bg-orange-600','bg-amber-800','bg-yellow-400','bg-purple-500'];
                  return count > 0 ? `
                    <div>
                      <div class="flex justify-between text-sm mb-1"><span class="capitalize text-muted">${cat}</span><span class="font-bold">${count}</span></div>
                      <div class="h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full ${colors[i] || 'bg-gray-400'} rounded-full" style="width:${pct}%"></div></div>
                    </div>
                  ` : '';
                }).join('')}
              </div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
              <h3 class="font-bold text-text mb-4">Top Performing</h3>
              <div class="space-y-3">
                ${state.vendors.filter(v => v.status === 'approved' && !v.suspended).sort((a,b) => (b.views||0) - (a.views||0)).slice(0,5).map((v,i) => `
                  <div class="flex items-center gap-3">
                    <div class="w-6 h-6 rounded-full bg-gray-100 flex items-center justify-center text-xs font-bold text-muted">${i+1}</div>
                    <div class="flex-1">
                      <div class="text-sm font-bold text-text">${v.name}</div>
                      <div class="text-xs text-muted">${formatNumber(v.views)} views</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ===================== SETTINGS =====================
    function renderSettings() {
      return `
        <div class="max-w-2xl space-y-6">
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <h3 class="text-lg font-bold text-text mb-6">⚙️ Verification Settings</h3>
            <div class="space-y-4">
              <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl">
                <div><div class="font-bold text-text">Auto-approve trusted vendors</div><div class="text-sm text-muted">Vendors with 3+ approved photos skip manual review</div></div>
                <div class="w-12 h-7 bg-accent rounded-full relative cursor-pointer"><div class="w-5 h-5 bg-white rounded-full absolute top-1 right-1 shadow"></div></div>
              </div>
              <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl">
                <div><div class="font-bold text-text">Require selfie verification</div><div class="text-sm text-muted">Every vendor must submit a selfie with their cart</div></div>
                <div class="w-12 h-7 bg-accent rounded-full relative cursor-pointer"><div class="w-5 h-5 bg-white rounded-full absolute top-1 right-1 shadow"></div></div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ===================== MODALS =====================
    function renderModal() {
      if (!state.modalVendor) return '';
      const v = state.vendors.find(x => x.id === state.modalVendor);
      if (!v) return '';
      const mapsUrl = `https://www.google.com/maps?q=${v.lat || 12.9352},${v.lng || 77.6245}`;
      const dirUrl = `https://www.google.com/maps/dir/?api=1&destination=${v.lat || 12.9352},${v.lng || 77.6245}`;
      return `
        <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onclick="closeModal()">
          <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-auto modal-enter" onclick="event.stopPropagation()">
            <div class="p-6">
              <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-4">
                  <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary to-orange-600 flex items-center justify-center text-white text-2xl font-bold">${v.name.charAt(0)}</div>
                  <div>
                    <h2 class="text-xl font-bold text-text">${v.name}</h2>
                    <p class="text-sm text-muted">${v.phone} · ${v.location}</p>
                  </div>
                </div>
                <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition-all"><i class="fas fa-times"></i></button>
              </div>

              <!-- Location Map -->
              <div class="mb-4">
                <div class="flex items-center justify-between mb-2">
                  <span class="font-bold text-sm">📍 Location</span>
                  <a href="${dirUrl}" target="_blank" class="text-primary text-xs font-semibold hover:underline">Open in Maps →</a>
                </div>
                <iframe class="map-embed" src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d1000!2d${v.lng || 77.6245}!3d${v.lat || 12.9352}!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin!4v1" allowfullscreen="" loading="lazy"></iframe>
                <div class="text-xs text-muted mt-1">Lat: ${(v.lat || 12.9352).toFixed(4)}, Lng: ${(v.lng || 77.6245).toFixed(4)}</div>
              </div>

              <!-- Credentials -->
              <div class="bg-gray-50 rounded-xl p-4 mb-4">
                <div class="flex items-center justify-between mb-2">
                  <span class="font-bold text-sm">🔐 Login Credentials</span>
                  <button onclick="regenCreds('${v.id}')" class="text-primary text-xs font-semibold hover:underline">Regenerate</button>
                </div>
                <div class="space-y-2">
                  <div class="flex items-center gap-2">
                    <span class="text-xs text-muted w-20">Username:</span>
                    <input type="text" id="cred-user-${v.id}" value="${v.username || ''}" class="flex-1 px-3 py-1.5 border border-gray-200 rounded-lg text-sm" placeholder="Not set">
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="text-xs text-muted w-20">Password:</span>
                    <input type="text" id="cred-pass-${v.id}" value="${v.password || ''}" class="flex-1 px-3 py-1.5 border border-gray-200 rounded-lg text-sm" placeholder="Not set">
                  </div>
                  <button onclick="saveCreds('${v.id}')" class="w-full mt-2 py-2 bg-primary text-white rounded-lg text-sm font-bold">💾 Save Credentials</button>
                </div>
              </div>

              <div class="grid grid-cols-3 gap-4">
                <div class="bg-gray-50 rounded-xl p-4 text-center"><div class="text-2xl font-extrabold text-text">${v.rating || '-'}</div><div class="text-xs text-muted">Rating</div></div>
                <div class="bg-gray-50 rounded-xl p-4 text-center"><div class="text-2xl font-extrabold text-text">${formatNumber(v.views)}</div><div class="text-xs text-muted">Views</div></div>
                <div class="bg-gray-50 rounded-xl p-4 text-center"><div class="text-2xl font-extrabold text-text">${v.calls || 0}</div><div class="text-xs text-muted">Calls</div></div>
              </div>

              <div class="flex gap-3 pt-4 flex-wrap">
                ${v.status === 'pending' ? `
                  <button onclick="approveVendor('${v.id}'); closeModal();" class="flex-1 btn-approve text-white py-3 rounded-xl font-bold shadow-lg shadow-green-200">✓ Approve Vendor</button>
                  <button onclick="rejectVendor('${v.id}'); closeModal();" class="flex-1 btn-reject text-white py-3 rounded-xl font-bold shadow-lg shadow-red-200">✕ Reject</button>
                ` : v.status === 'approved' ? `
                  <button onclick="toggleVendorLive('${v.id}'); closeModal();" class="flex-1 ${v.live ? 'bg-gray-100 text-gray-600' : 'btn-approve text-white'} py-3 rounded-xl font-bold">${v.live ? '⏸ Take Offline' : '▶ Go Live'}</button>
                ` : ''}
                ${v.status === 'approved' ? `
                  <button onclick="toggleSuspend('${v.id}'); closeModal();" class="flex-1 ${v.suspended ? 'btn-approve text-white' : 'bg-warning text-white'} py-3 rounded-xl font-bold">${v.suspended ? '✓ Unsuspend' : '⛔ Suspend'}</button>
                ` : ''}
                <button onclick="deleteVendor('${v.id}'); closeModal();" class="flex-1 bg-danger text-white py-3 rounded-xl font-bold">🗑 Delete</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderPhotoModal() {
      if (!state.modalPhoto) return '';
      const p = state.photos.find(x => x.id === state.modalPhoto);
      if (!p) return '';
      return `
        <div class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 photo-viewer-overlay" onclick="closePhotoModal()">
          <button onclick="closePhotoModal()" class="absolute top-6 right-6 w-12 h-12 bg-white/20 hover:bg-white/30 rounded-full flex items-center justify-center text-white text-xl transition-all">✕</button>
          <div class="max-w-4xl max-h-[85vh]" onclick="event.stopPropagation()">
            <img src="${p.url}" class="max-w-full max-h-[70vh] rounded-2xl shadow-2xl" alt="${p.caption}">
            <div class="mt-4 text-center">
              <div class="text-white font-bold text-lg">${p.caption}</div>
              <div class="text-white/70 text-sm">${p.vendorName} · ${p.type} · ${p.submittedAt}</div>
              ${p.status === 'pending' ? `
                <div class="flex gap-3 justify-center mt-4">
                  <button onclick="approvePhoto('${p.id}'); closePhotoModal();" class="btn-approve text-white px-8 py-3 rounded-xl font-bold shadow-lg">✓ Approve</button>
                  <button onclick="openRejectModal('${p.id}'); closePhotoModal();" class="btn-reject text-white px-8 py-3 rounded-xl font-bold shadow-lg">✕ Reject</button>
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function renderToast() {
      const container = $('#toast-container');
      if (!container) return;
      if (!state.toast) { container.innerHTML = ''; return; }
      container.innerHTML = `
        <div class="fixed top-6 left-1/2 -translate-x-1/2 z-[60] toast-enter">
          <div class="bg-text text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 font-semibold text-sm">
            <span>${state.toast.type === 'success' ? '✅' : state.toast.type === 'error' ? '❌' : 'ℹ️'}</span>
            ${state.toast.message}
          </div>
        </div>
      `;
    }

    function renderStatusBadge(status, suspended) {
      if (suspended) return `<span class="status-suspended text-xs font-bold px-3 py-1.5 rounded-full">⛔ Suspended</span>`;
      const config = { pending: { cls: 'status-pending', text: '⏳ Pending' }, approved: { cls: 'status-approved', text: '✓ Approved' }, rejected: { cls: 'status-rejected', text: '✕ Rejected' } };
      const c = config[status] || config.pending;
      return `<span class="${c.cls} text-xs font-bold px-3 py-1.5 rounded-full">${c.text}</span>`;
    }

    // ===================== ACTIONS =====================
    function setTab(tab) { state.activeTab = tab; render(); }
    function toggleSidebar() { state.sidebarCollapsed = !state.sidebarCollapsed; render(); }
    function setVendorFilter(f) { state.filterStatus = f; state.selectedVendors.clear(); render(); }
    function setPhotoTab(t) { state.photoTab = t; render(); }
    function updateSearch(q) { state.searchQuery = q; render(); }
    function updateFilter(f) { state.sortBy = f; render(); }
    function toggleVendor(id) { if (state.selectedVendors.has(id)) state.selectedVendors.delete(id); else state.selectedVendors.add(id); render(); }
    function toggleSelectAll(checked, filter) {
      let filtered = state.vendors;
      if (filter !== 'all') filtered = filtered.filter(v => v.status === filter);
      if (checked) filtered.forEach(v => state.selectedVendors.add(v.id));
      else filtered.forEach(v => state.selectedVendors.delete(v.id));
      render();
    }
    function clearSelection() { state.selectedVendors.clear(); render(); }
    function openVendorModal(id) { state.modalVendor = id; render(); }
    function closeModal() { state.modalVendor = null; render(); }
    function openPhotoModal(id) { state.modalPhoto = id; render(); }
    function closePhotoModal() { state.modalPhoto = null; render(); }
    function openRejectModal(photoId) { const reason = prompt('Rejection reason (required):', 'Photo does not meet guidelines'); if (reason) rejectPhoto(photoId, reason); }

    async function approveVendor(id) {
      const v = state.vendors.find(x => x.id === id);
      if (v) {
        v.status = 'approved';
        if (!v.username) v.username = genUsername(v.name);
        if (!v.password) v.password = genPassword();
        await saveAdminState();
        showToast(`${v.name} approved! Credentials: ${v.username} / ${v.password}`);
      }
      render();
    }
    async function rejectVendor(id) {
      const v = state.vendors.find(x => x.id === id);
      if (v) { v.status = 'rejected'; v.rejectReason = 'Does not meet guidelines'; await saveAdminState(); showToast(`${v.name} rejected.`); }
      render();
    }
    async function toggleVendorLive(id) {
      const v = state.vendors.find(x => x.id === id);
      if (v) { v.live = !v.live; await saveAdminState(); showToast(`${v.name} is now ${v.live ? 'LIVE' : 'offline'}`); }
      render();
    }
    async function toggleSuspend(id) {
      const v = state.vendors.find(x => x.id === id);
      if (v) { v.suspended = !v.suspended; v.live = v.suspended ? false : v.live; await saveAdminState(); showToast(`${v.name} ${v.suspended ? 'suspended' : 'unsuspended'}`); }
      render();
    }
    async function deleteVendor(id) {
      if (!confirm('Are you sure you want to permanently delete this vendor? This cannot be undone.')) return;
      state.vendors = state.vendors.filter(x => x.id !== id);
      await deleteVendorDoc(id);
      await saveAdminState();
      showToast('Vendor deleted permanently.');
      render();
    }
    async function regenCreds(id) {
      const v = state.vendors.find(x => x.id === id);
      if (v) {
        v.username = genUsername(v.name);
        v.password = genPassword();
        await saveAdminState();
        showToast(`New credentials: ${v.username} / ${v.password}`);
        render();
      }
    }
    async function saveCreds(id) {
      const v = state.vendors.find(x => x.id === id);
      if (v) {
        v.username = document.getElementById('cred-user-' + id).value.trim();
        v.password = document.getElementById('cred-pass-' + id).value.trim();
        await saveAdminState();
        showToast('Credentials saved!');
      }
    }
    async function batchApprove() {
      state.selectedVendors.forEach(id => {
        const v = state.vendors.find(x => x.id === id);
        if (v) {
          v.status = 'approved';
          if (!v.username) v.username = genUsername(v.name);
          if (!v.password) v.password = genPassword();
        }
      });
      await saveAdminState();
      showToast(`${state.selectedVendors.size} vendors approved!`);
      state.selectedVendors.clear();
      render();
    }
    async function batchReject() {
      state.selectedVendors.forEach(id => {
        const v = state.vendors.find(x => x.id === id);
        if (v) { v.status = 'rejected'; v.rejectReason = 'Batch rejection'; }
      });
      await saveAdminState();
      showToast(`${state.selectedVendors.size} vendors rejected.`);
      state.selectedVendors.clear();
      render();
    }
    async async function approvePhoto(id) {
      const p = state.photos.find(x => x.id === id);
      if (!p) return;
      const v = state.vendors.find(x => x.id === p.vendorId);
      if (v && v.photos) {
        const photo = v.photos.find(x => x.id === id);
        if (photo) { photo.status = 'approved'; photo.rejectReason = ''; await saveAdminState(); showToast('Photo approved!'); }
      }
      render();
    }
    async function rejectPhoto(id, reason) {
      const p = state.photos.find(x => x.id === id);
      if (!p) return;
      const v = state.vendors.find(x => x.id === p.vendorId);
      if (v && v.photos) {
        const photo = v.photos.find(x => x.id === id);
        if (photo) { photo.status = 'rejected'; photo.rejectReason = reason; await saveAdminState(); showToast('Photo rejected.'); }
      }
      render();
    }
    async function batchApprovePhotos() {
      state.photos.filter(p => p.status === 'pending').forEach(p => {
        const v = state.vendors.find(x => x.id === p.vendorId);
        if (v && v.photos) { const photo = v.photos.find(x => x.id === p.id); if (photo) { photo.status = 'approved'; photo.rejectReason = ''; } }
      });
      await saveAdminState();
      showToast('All pending photos approved!');
      render();
    }
    async function batchRejectPhotos() {
      state.photos.filter(p => p.status === 'pending').forEach(p => {
        const v = state.vendors.find(x => x.id === p.vendorId);
        if (v && v.photos) { const photo = v.photos.find(x => x.id === p.id); if (photo) { photo.status = 'rejected'; photo.rejectReason = 'Does not meet guidelines'; } }
      });
      await saveAdminState();
      showToast('All pending photos rejected.');
      render();
    }

    window.addEventListener('focus', () => render());
    document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

    state.photoTab = 'pending';
    function onFirebaseReady() {
      render();
      const loading = document.getElementById('firebase-loading');
      if (loading) loading.style.display = 'none';
    }
    try {
      initFirebase();
    } catch (e) {
      console.error('Initial render error:', e);
      const app = document.getElementById('app');
      if (app) app.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;"><h2 style="color:#FF6B35">Nukkad Admin</h2><p style="color:#666">Something went wrong loading the panel.</p><p style="color:#999;font-size:12px">' + (e.message || e) + '</p></div>';
    }
  </script>
</body>
</html>
